<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTS 刻字戒指限時抽獎</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Noto Sans TC', 'sans-serif'],
                        serif: ['Cinzel', 'serif'],
                    },
                    colors: {
                        bts: {
                            light: '#e9d5ff',  
                            neon: '#c084fc',   
                            main: '#a855f7',   
                            soft: '#d8b4fe',   
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #07030d;
            background-image: 
                linear-gradient(rgba(15, 5, 29, 0.55), rgba(15, 5, 29, 0.65)),
                url('https://i.ibb.co/SXrSZMDK/bts3.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            color: #ffffff;
        }

        .glass-panel-transparent {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(216, 180, 254, 0.35);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .glass-panel-glow {
            border: 1px solid rgba(192, 132, 252, 0.5);
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.25), inset 0 0 15px rgba(216, 180, 254, 0.1);
        }

        .btn-bts-purple {
            background: linear-gradient(135deg, #a855f7 0%, #c084fc 50%, #e9d5ff 100%);
            background-size: 200% 200%;
            animation: shimmer 3s ease infinite;
            box-shadow: 0 0 20px rgba(192, 132, 252, 0.5);
            color: #1e0938;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-bts-purple:hover:not(:disabled) {
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 0 30px rgba(216, 180, 254, 0.8);
        }

        .btn-bts-purple:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
            color: #ffffff;
        }

        @keyframes shimmer {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes slotRoll {
            0% { transform: translateY(-100%); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(100%); opacity: 0; }
        }

        .rolling-text {
            animation: slotRoll 0.08s infinite linear;
        }

        .pulse-glow {
            animation: pulseGlow 2.5s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { filter: drop-shadow(0 0 5px rgba(216, 180, 254, 0.4)); }
            100% { filter: drop-shadow(0 0 18px rgba(192, 132, 252, 0.9)); }
        }

        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(10, 5, 18, 0.4);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(216, 180, 254, 0.4);
            border-radius: 10px;
        }
    </style>
</head>
<body class="font-sans antialiased flex flex-col justify-between p-4 sm:p-6 relative overflow-x-hidden min-h-screen">

    <!-- 頂部 Header 區域 -->
    <header class="max-w-xl mx-auto w-full text-center mt-3 mb-4 relative z-10">
        <div class="inline-flex items-center gap-2 bg-purple-950/40 border border-purple-300/40 px-4 py-1 rounded-full text-xs font-semibold text-purple-200 mb-2 shadow-lg backdrop-blur-md">
            <i class="fa-solid fa-sparkles text-purple-300"></i>
            <span class="tracking-widest uppercase font-serif">BTS EVENT · SPECIAL GIFT</span>
        </div>
        
        <h1 class="text-4xl sm:text-5xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-purple-200 via-purple-100 to-fuchsia-200 mb-1 font-serif drop-shadow-[0_2px_10px_rgba(168,85,247,0.5)]">
            BTS 抽獎活動
        </h1>
        <p class="text-purple-100 text-xs sm:text-sm font-medium tracking-wide drop-shadow">
            祝大家運氣爆棚! 💜
        </p>
    </header>

    <!-- 主要內容卡片區 -->
    <main class="max-w-md mx-auto w-full flex-1 flex flex-col justify-center relative z-10">
        <div class="glass-panel-transparent glass-panel-glow rounded-3xl p-5 sm:p-6 shadow-2xl relative overflow-hidden">
            
            <!-- 活動狀態與計時列 -->
            <div id="statusBanner" class="bg-purple-950/30 border border-purple-300/30 text-purple-100 text-xs py-2 px-4 rounded-2xl text-center mb-4 flex justify-between items-center backdrop-blur-md">
                <span class="font-bold flex items-center gap-2">
                    <span id="statusDot" class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></span>
                    <span id="statusText">距離活動結束</span>
                </span>
                <span id="countdownTimer" class="font-mono font-black text-purple-200 tracking-wider">--:--:--</span>
            </div>

            <!-- 獎品焦點 Showcase Card -->
            <div class="relative bg-purple-950/25 border border-purple-300/30 rounded-2xl p-3.5 mb-4 overflow-hidden backdrop-blur-sm">
                <div class="flex items-center gap-3.5">
                    <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-purple-400 to-purple-200 p-0.5 shadow-lg flex-shrink-0 pulse-glow">
                        <div class="w-full h-full bg-slate-950/80 rounded-[14px] flex items-center justify-center text-purple-200 text-2xl">
                            <i class="fa-solid fa-ring"></i>
                        </div>
                    </div>

                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-1.5 mb-0.5">
                            <span class="text-[10px] font-extrabold bg-purple-400/30 text-purple-100 px-2 py-0.5 rounded-full border border-purple-300/40 uppercase tracking-wider">首獎禮品</span>
                            <span class="text-[10px] text-purple-200 font-semibold"><i class="fa-solid fa-gem mr-1"></i>限量 5 份</span>
                        </div>
                        <h2 class="text-base sm:text-lg font-black text-white truncate drop-shadow">
                            BTS 刻字戒指一枚
                        </h2>
                        <p class="text-xs text-purple-200/90 truncate">專屬客製獨家紀念款</p>
                    </div>
                </div>

                <div class="mt-2.5 pt-2 border-t border-purple-300/20 flex items-center justify-between">
                    <span class="text-xs text-purple-200/90 font-medium">已參與人數 / 庫存</span>
                    <div class="flex items-baseline gap-1">
                        <span id="participantCount" class="text-xl font-black text-purple-200 drop-shadow">0</span>
                        <span class="text-xs text-purple-300/80 font-bold">/ 500 人</span>
                        <span class="text-xs text-purple-300/50 mx-1">|</span>
                        <span class="text-xs text-purple-200/90 font-medium">剩</span>
                        <span id="stockDisplay" class="text-xl font-black text-purple-200 drop-shadow">5</span>
                        <span class="text-xs text-purple-300/80 font-bold">個</span>
                    </div>
                </div>
            </div>

            <!-- 抽獎提示/結果區 -->
            <div id="displayScreen" class="py-2 mb-3 text-center min-h-[48px] flex items-center justify-center">
                <div id="screenContent">
                    <p class="text-purple-100 text-xs sm:text-sm font-medium drop-shadow">請於下方填寫資料即可開始抽獎</p>
                </div>
            </div>

            <!-- 抽獎表單 -->
            <form id="lotteryForm" onsubmit="handleDraw(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-purple-100 mb-1">
                        <i class="fa-brands fa-threads mr-1 text-purple-300"></i> Threads 帳號 <span class="text-purple-300">*</span>
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-purple-300 font-bold text-sm">@</span>
                        <input type="text" id="threadsInput" required placeholder="請輸入 Threads ID" 
                               class="w-full pl-8 pr-4 py-2 bg-purple-950/40 border border-purple-300/40 rounded-xl text-white placeholder-purple-200/40 focus:outline-none focus:border-purple-300 focus:ring-2 focus:ring-purple-300/30 text-sm transition">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2.5">
                    <div>
                        <label class="block text-xs font-semibold text-purple-100 mb-1">
                            <i class="fa-solid fa-user mr-1 text-purple-300"></i> 真實姓名 <span class="text-purple-300">*</span>
                        </label>
                        <input type="text" id="nameInput" required placeholder="田果果" 
                               class="w-full px-3.5 py-2 bg-purple-950/40 border border-purple-300/40 rounded-xl text-white placeholder-purple-200/40 focus:outline-none focus:border-purple-300 focus:ring-2 focus:ring-purple-300/30 text-sm transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-purple-100 mb-1">
                            <i class="fa-solid fa-phone mr-1 text-purple-300"></i> 手機後 3 碼 <span class="text-purple-300">*</span>
                        </label>
                        <input type="text" id="phoneInput" required maxlength="3" pattern="\d{3}" placeholder="123" 
                               class="w-full px-3.5 py-2 bg-purple-950/40 border border-purple-300/40 rounded-xl text-white placeholder-purple-200/40 focus:outline-none focus:border-purple-300 focus:ring-2 focus:ring-purple-300/30 text-sm transition text-center tracking-widest">
                    </div>
                </div>

                <div class="bg-purple-950/30 border border-purple-300/20 rounded-xl p-2 text-[11px] text-purple-100/90 leading-relaxed flex items-start gap-1.5 backdrop-blur-sm">
                    <i class="fa-solid fa-shield-halved text-purple-300 mt-0.5 flex-shrink-0"></i>
                    <span>限前 500 名參與，每人限抽一次！</span>
                </div>

                <button type="submit" id="drawBtn" disabled
                        class="btn-bts-purple w-full py-3 text-purple-950 font-black rounded-xl text-base flex items-center justify-center gap-2 mt-2 tracking-wider">
                    <i class="fa-solid fa-gift"></i>
                    <span id="btnText">確認資料並抽獎</span>
                </button>
            </form>

        </div>
    </main>

    <footer class="max-w-md mx-auto w-full text-center mt-4 text-xs text-purple-200/70 flex items-center justify-between gap-2 relative z-10 px-2 drop-shadow">
        <div>© BTS FAN EVENT · @orange._.bts_613</div>
        <button onclick="openAdminModal()" class="hover:text-white underline transition flex items-center gap-1">
            <i class="fa-solid fa-lock"></i> 管理者後台
        </button>
    </footer>

    <!-- 管理者控制台 Modal -->
    <div id="adminModal" class="fixed inset-0 bg-black/75 backdrop-blur-md hidden items-center justify-center p-4 z-50">
        <div class="glass-panel-transparent max-w-lg w-full rounded-2xl p-6 border border-purple-300/40 max-h-[90vh] overflow-y-auto bg-slate-950/80">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-purple-300/20">
                <h3 class="font-bold text-lg text-purple-200 flex items-center gap-2">
                    <i class="fa-solid fa-sliders"></i> 管理者控制台
                </h3>
                <button onclick="closeAdminModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <div id="adminAuth">
                <p class="text-sm text-purple-200 mb-3">請輸入管理員登入密碼：</p>
                <div class="flex gap-2">
                    <input type="password" id="adminPassword" placeholder="輸入密碼" class="flex-1 bg-purple-950/60 border border-purple-300/40 rounded-xl px-3.5 py-2 text-sm text-white focus:outline-none">
                    <button onclick="verifyAdmin()" class="bg-purple-600 hover:bg-purple-500 text-white px-4 py-2 rounded-xl text-sm font-medium transition">登入</button>
                </div>
            </div>

            <div id="adminPanel" class="hidden space-y-5">
                <div class="bg-purple-950/40 p-4 rounded-xl border border-purple-300/30">
                    <div class="flex items-center justify-between">
                        <div>
                            <div class="text-sm font-medium text-white">測試模式（忽略 11/14 時間限制）</div>
                            <div class="text-xs text-purple-200/70">開啟後即可在活動時間前測試流程</div>
                        </div>
                        <input type="checkbox" id="testModeToggle" onchange="toggleTestMode(this.checked)" class="w-5 h-5 accent-purple-500 cursor-pointer">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-purple-950/40 p-3 rounded-xl border border-purple-300/30 text-center">
                        <div class="text-xs text-purple-200/70">剩餘戒指庫存</div>
                        <div id="adminStock" class="text-2xl font-bold text-purple-200">5</div>
                    </div>
                    <div class="bg-purple-950/40 p-3 rounded-xl border border-purple-300/30 text-center">
                        <div class="text-xs text-purple-200/70">已參與總人數</div>
                        <div id="adminTotalParticipants" class="text-2xl font-bold text-purple-300">0</div>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="block text-xs font-medium text-purple-200">設定預設中獎機率 (%)</label>
                    <div class="flex items-center gap-3">
                        <input type="range" id="winRateRange" min="0.1" max="100" value="1.0" step="0.1" oninput="document.getElementById('rateVal').innerText = this.value + '%'" class="flex-1 accent-purple-500">
                        <span id="rateVal" class="text-sm font-bold text-purple-200 w-12 text-right">1.0%</span>
                    </div>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-xs font-medium text-purple-200">參與者與中獎紀錄 (已同步雲端)</label>
                        <button onclick="fetchCloudRecords()" class="text-xs bg-purple-600 hover:bg-purple-500 text-white px-2.5 py-1 rounded-lg transition flex items-center gap-1">
                            <i class="fa-solid fa-arrows-rotate"></i> 重整列表
                        </button>
                    </div>
                    <div id="participantList" class="bg-purple-950/60 rounded-xl p-3 max-h-40 overflow-y-auto text-xs space-y-1.5 border border-purple-300/30">
                        <div class="text-purple-200/50 text-center py-2">載入雲端紀錄中...</div>
                    </div>
                </div>

                <div class="pt-2 border-t border-purple-300/20 flex justify-end">
                    <button onclick="closeAdminModal()" class="bg-slate-800 hover:bg-slate-700 text-white text-xs px-4 py-2 rounded-xl">關閉</button>
                </div>
            </div>
        </div>
    </div>

    <!-- JS 邏輯腳本 -->
    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzHCdH8zRsMLgIDLXYlA1a_eOXwhDPh1RuArvzCNS_Lry-C9kMNXRlKTOo59yTGfu8x8A/exec";

        const EVENT_CONFIG = {
            endDate: new Date('2026-11-14T23:59:59+08:00').getTime(),
            totalStock: 5,
            maxParticipants: 500
        };

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'click') {
                    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.05);
                } else if (type === 'roll') {
                    osc.frequency.setValueAtTime(250 + Math.random() * 350, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.04);
                } else if (type === 'win') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                    osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
                    osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.5);
                } else if (type === 'lose') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(110, audioCtx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.3);
                }
            } catch (e) {
                console.log('Audio Context error:', e);
            }
        }

        let state = {
            stock: EVENT_CONFIG.totalStock,
            records: [],
            testMode: JSON.parse(localStorage.getItem('lottery_test_mode')) || false,
            winRate: 1.0
        };

        document.addEventListener('DOMContentLoaded', () => {
            fetchCloudRecords();
            checkEventTimeStatus();
            setInterval(checkEventTimeStatus, 1000);
            document.getElementById('testModeToggle').checked = state.testMode;
        });

        // 讀取雲端試算表紀錄
        async function fetchCloudRecords() {
            if (!GOOGLE_SCRIPT_URL) return;
            try {
                const response = await fetch(GOOGLE_SCRIPT_URL);
                const data = await response.json();
                if (data.status === 'success') {
                    state.records = data.records;
                    const winCount = state.records.filter(r => r.win === "中獎" || r.win === true).length;
                    state.stock = Math.max(0, EVENT_CONFIG.totalStock - winCount);
                    updateUI();
                }
            } catch (err) {
                console.error("無法連線至雲端試算表：", err);
            }
        }

        function checkEventTimeStatus() {
            const now = new Date().getTime();
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const countdownTimer = document.getElementById('countdownTimer');
            const drawBtn = document.getElementById('drawBtn');
            const btnText = document.getElementById('btnText');

            const isFull = state.records.length >= EVENT_CONFIG.maxParticipants;

            if (state.testMode) {
                statusDot.className = "w-2.5 h-2.5 rounded-full bg-purple-300 animate-pulse";
                statusText.innerText = "測試模式中（忽略時間限制）";
                countdownTimer.innerText = "TEST MODE";
                if (isFull) {
                    drawBtn.disabled = true;
                    btnText.innerText = "已達 500 人上限，活動結束";
                } else if (state.stock <= 0) {
                    drawBtn.disabled = true;
                    btnText.innerText = "戒指已全數被抽完";
                } else {
                    drawBtn.disabled = false;
                    btnText.innerText = "確認資料並抽獎";
                }
                return;
            }

            if (now <= EVENT_CONFIG.endDate) {
                statusDot.className = "w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping";
                statusText.innerText = "距離活動結束";
                countdownTimer.innerText = formatCountdown(EVENT_CONFIG.endDate - now);
                
                if (isFull) {
                    drawBtn.disabled = true;
                    btnText.innerText = "已達 500 人上限，活動結束";
                } else if (state.stock <= 0) {
                    drawBtn.disabled = true;
                    btnText.innerText = "獎品已全數抽完";
                } else {
                    drawBtn.disabled = false;
                    btnText.innerText = "確認資料並抽獎";
                }
            } else {
                statusDot.className = "w-2.5 h-2.5 rounded-full bg-rose-500";
                statusText.innerText = "活動已結束";
                countdownTimer.innerText = "00:00:00";
                drawBtn.disabled = true;
                btnText.innerText = "活動已結束 (已逾期)";
            }
        }

        function formatCountdown(ms) {
            const totalSec = Math.floor(ms / 1000);
            const hrs = String(Math.floor(totalSec / 3600)).padStart(2, '0');
            const mins = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
            const secs = String(totalSec % 60).padStart(2, '0');
            return `${hrs}:${mins}:${secs}`;
        }

        async function handleDraw(e) {
            e.preventDefault();
            playSound('click');

            let rawThreads = document.getElementById('threadsInput').value.trim();
            const name = document.getElementById('nameInput').value.trim();
            const phone = document.getElementById('phoneInput').value.trim();

            if (!rawThreads || !name || !phone || phone.length !== 3) {
                alert('請完整正確填寫所有欄位！');
                return;
            }

            const threads = rawThreads.startsWith('@') ? rawThreads : '@' + rawThreads;

            const drawBtn = document.getElementById('drawBtn');
            drawBtn.disabled = true;
            document.getElementById('btnText').innerText = '正在核對紀錄...';

            await fetchCloudRecords();

            // 檢查是否超過 500 人
            if (state.records.length >= EVENT_CONFIG.maxParticipants) {
                alert('抱歉，名額已達 500 人上限，活動結束囉！');
                checkEventTimeStatus();
                return;
            }

            const isThreadsUsed = state.records.some(r => String(r.threads).toLowerCase() === threads.toLowerCase());
            const isPhoneUsed = state.records.some(r => String(r.phone) === String(phone));

            if (isThreadsUsed || isPhoneUsed) {
                alert(`帳號 (${threads}) 或手機號碼已參與過抽獎！每人限抽一次。`);
                checkEventTimeStatus();
                return;
            }

            if (state.stock <= 0) {
                alert('BTS 刻字戒指已全數被抽完囉！感謝您的參與。');
                checkEventTimeStatus();
                return;
            }

            // 開始滾動動畫
            document.getElementById('btnText').innerText = '正在演算結果...';
            const screen = document.getElementById('screenContent');
            let rollCount = 0;
            const rollInterval = setInterval(() => {
                playSound('roll');
                screen.innerHTML = `
                    <div class="rolling-text text-purple-200 font-black text-xl tracking-wider">
                        ${Math.floor(Math.random() * 9000 + 1000)}
                    </div>
                    <div class="text-[11px] text-purple-200/80 mt-1">正在演算幸運結果...</div>
                `;
                rollCount++;
                if (rollCount > 25) {
                    clearInterval(rollInterval);
                    executeDrawResult(threads, name, phone);
                }
            }, 100);
        }

        async function executeDrawResult(threads, name, phone) {
            const winRate = parseFloat(document.getElementById('winRateRange').value) || 1.0;
            const randomVal = Math.random() * 100;
            const isWin = randomVal < winRate && state.stock > 0;

            const record = {
                threads: threads,
                name: name,
                phone: phone,
                win: isWin,
                time: new Date().toLocaleString('zh-TW')
            };

            // 寫入 Google 試算表
            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(record)
                });
            } catch (err) {
                console.error("同步至雲端失敗：", err);
            }

            if (isWin) {
                state.stock = Math.max(0, state.stock - 1);
            }

            state.records.push(record);

            const screen = document.getElementById('screenContent');
            if (isWin) {
                playSound('win');
                confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
                screen.innerHTML = `
                    <div class="text-purple-200 font-black text-lg mb-0.5">
                        恭喜抽中 BTS 刻字戒指！
                    </div>
                    <p class="text-[11px] text-purple-100">請務必截圖此畫面，並私訊官方 Threads 核對發獎！</p>
                `;
            } else {
                playSound('lose');
                screen.innerHTML = `
                    <div class="text-rose-300 font-bold text-base mb-0.5">
                        銘謝惠顧
                    </div>
                    <p class="text-[11px] text-purple-200/80">很可惜未抽中，感謝您的熱情參與！</p>
                `;
            }

            updateUI();
            checkEventTimeStatus();
        }

        function updateUI() {
            const count = state.records.length;
            document.getElementById('participantCount').innerText = count;
            document.getElementById('stockDisplay').innerText = state.stock;
            document.getElementById('adminStock').innerText = state.stock;
            document.getElementById('adminTotalParticipants').innerText = count;

            const listContainer = document.getElementById('participantList');
            if (count === 0) {
                listContainer.innerHTML = `<div class="text-purple-200/50 text-center py-2">尚無抽獎紀錄</div>`;
            } else {
                listContainer.innerHTML = state.records.map(r => {
                    const isWinText = (r.win === "中獎" || r.win === true);
                    return `
                        <div class="flex items-center justify-between border-b border-purple-300/10 pb-1">
                            <div>
                                <span class="font-medium text-purple-200">${r.threads}</span> 
                                <span class="text-purple-200/50">(${r.name} / ${r.phone})</span>
                            </div>
                            <div>
                                ${isWinText ? '<span class="text-amber-300 font-bold">🎉 已中獎</span>' : '<span class="text-purple-200/40">未中</span>'}
                            </div>
                        </div>
                    `;
                }).join('');
            }
        }

        function openAdminModal() {
            document.getElementById('adminModal').classList.remove('hidden');
            document.getElementById('adminModal').classList.add('flex');
            fetchCloudRecords();
        }

        function closeAdminModal() {
            document.getElementById('adminModal').classList.add('hidden');
            document.getElementById('adminModal').classList.remove('flex');
        }

        function verifyAdmin() {
            const pwd = document.getElementById('adminPassword').value;
            if (pwd === 'ys3366') {
                document.getElementById('adminAuth').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
            } else {
                alert('密碼錯誤！');
            }
        }

        function toggleTestMode(enabled) {
            state.testMode = enabled;
            localStorage.setItem('lottery_test_mode', JSON.stringify(enabled));
            checkEventTimeStatus();
        }
    </script>
</body>
</html>
